services:
  db:
    # postgres:16 plus the pgvector extension (the retrieval index,
    # app/retrieval/). Same data-directory format as the plain postgres:16
    # image this replaced, so an existing db_data volume keeps working.
    # Pinned to the trixie (Debian 13, glibc 2.41) variant: the dev volume
    # was initialized under glibc 2.41, and the bookworm-based pg16 tag
    # (glibc 2.36) logs a collation version mismatch on every connection.
    image: pgvector/pgvector:pg16-trixie
    environment:
      POSTGRES_USER: docpilot
      POSTGRES_PASSWORD: docpilot
      POSTGRES_DB: docpilot
    ports:
      # 5434 on the host: 5432/5433 are taken by another local project's
      # Postgres. Bound to loopback so the dev database (default
      # credentials) is never reachable from other machines on the LAN.
      - "127.0.0.1:5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docpilot -d docpilot"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Every long-running service restarts with the Docker daemon. Without
    # this on db, a Docker Desktop restart brought api and worker back but
    # not the database, and the worker crash-looped on the unresolvable
    # `db` hostname until someone noticed.
    restart: unless-stopped

  # One-shot: runs migrations to head and exits. api/worker wait on its
  # success so the schema is always current before either starts serving
  # or claiming jobs.
  migrate:
    # migrate, api and worker run the same backend image under one name.
    # Built per service, `docker compose build api worker` left migrate on
    # a stale image, and `up` then skipped the new migrations silently.
    build: ./backend
    image: doc-pilot-backend
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://docpilot:docpilot@db:5432/docpilot
    restart: "no"
    # The backend image's baked-in healthcheck probes the API's /healthz;
    # this one-shot container runs alembic, not uvicorn, so that probe is
    # meaningless here.
    healthcheck:
      disable: true

  api:
    build: ./backend
    image: doc-pilot-backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # In-network: db's service name and container port, not the
      # 5434 host mapping used from outside the compose network.
      DATABASE_URL: postgresql+asyncpg://docpilot:docpilot@db:5432/docpilot
      # Must match worker's UPLOAD_DIR -- routers/documents.py persists
      # absolute storage_path strings that the worker and the file
      # endpoint later re-open, so both containers have to resolve the
      # same path onto the same shared volume.
      UPLOAD_DIR: /data/uploads
      # The API embeds search queries (GET /search), so it loads the same
      # embedding model as the worker -- see EMBEDDING_CACHE_DIR on worker.
      EMBEDDING_CACHE_DIR: /data/models
      # Tracing is off unless this is set -- see the `jaeger` service.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: doc-pilot-api
      # Langfuse (app/langfuse_link.py): LLM traces and evaluation scores,
      # on when both keys are set. Base URL defaults to Langfuse Cloud.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      # Share of answered /ask questions (0-1) the worker grades in the
      # background for groundedness -- one more model call each, so off
      # unless set. See app/evals/online.py.
      ASK_JUDGE_SAMPLE_RATE: ${ASK_JUDGE_SAMPLE_RATE:-0}
      # Uploads and /ask questions get 429 once the model spend recorded
      # since midnight UTC reaches this (USD); 0 turns the cap off. See
      # app/budget.py.
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-5}
      # Per-client requests per minute on the billed routes (0 = off); see
      # app/ratelimit.py. Behind Docker's port mapping every host
      # connection can arrive from the bridge gateway's address, so this is
      # effectively a global limit here -- behind a real reverse proxy, run
      # uvicorn with --proxy-headers for true per-client limits.
      ASK_RATE_LIMIT_PER_MINUTE: ${ASK_RATE_LIMIT_PER_MINUTE:-10}
      UPLOAD_RATE_LIMIT_PER_MINUTE: ${UPLOAD_RATE_LIMIT_PER_MINUTE:-0}
      # Only POST /ask (the question-answering agent, app/agent/) calls the
      # model from the API process; every other route runs without it, and
      # /ask returns 503 when this is empty.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - uploads:/data/uploads
      - models:/data/models
      # The committed eval-run artifacts, for GET /stats (last_eval) and the
      # monitoring dashboard's eval history (GET /monitoring/evals). The
      # image holds only backend/, and app/evals resolves EVALS_DIR to
      # /evals beside it.
      - ./evals/results:/evals/results:ro
    restart: unless-stopped

  worker:
    # Exactly one replica -- never `docker compose up --scale worker=2`.
    # reclaim_orphaned_jobs() runs once at worker startup (app/worker.py)
    # and resets any 'processing' job back to 'pending', assuming any
    # such row is a leftover from a previous run of this same process.
    # A second concurrent worker would have that sweep steal its
    # in-flight job.
    build: ./backend
    image: doc-pilot-backend
    command: python -m app.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://docpilot:docpilot@db:5432/docpilot
      # Must match api's UPLOAD_DIR -- see the comment there.
      UPLOAD_DIR: /data/uploads
      # Read by the healthcheck below as well as by the worker.
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
      # The worker calls the model for extraction and transcription; the
      # api service needs the key too, but only for POST /ask (see there).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Which extraction schema the worker asks for (app/extraction_fields.py).
      EXTRACTION_PROMPT_VERSION: ${EXTRACTION_PROMPT_VERSION:-extract_v1}
      # The pinned BAAI/bge-small-en-v1.5 files (about 135 MB, each
      # checksummed; see app/retrieval/model_fetch.py) download on first
      # use into this volume, shared with api, so it's fetched once rather
      # than on every container start.
      EMBEDDING_CACHE_DIR: /data/models
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: doc-pilot-worker
      # Langfuse: see the api service.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
    volumes:
      - uploads:/data/uploads
      - models:/data/models
    restart: unless-stopped
    # The backend image's baked-in healthcheck probes the API's /healthz;
    # the worker runs no HTTP server, so it gets its own: the worker touches
    # WORKER_HEARTBEAT_FILE every 10 s from a task beside its poll loop
    # (app/worker.py), through idle polls, long model calls and the first
    # embedding-model download alike, so the job length does not matter. The
    # check fails once the file is over 60 s old. Compose only reports
    # "unhealthy" (it does not restart on it); restart: unless-stopped
    # covers a crashed process. `up --wait` needs a healthcheck to wait on:
    # `disable: true` makes it fail with "has no healthcheck configured".
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime(os.environ['WORKER_HEARTBEAT_FILE']) < 60 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        # The browser-facing URL, not a compose service name: this gets
        # inlined into the client bundle at build time (see
        # frontend/Dockerfile) and every fetching page is a client
        # component, so it has to be a URL the BROWSER can reach --
        # http://api:8000 would only resolve inside the compose network.
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  # Opt-in trace viewer (app/telemetry.py). Starts only with the profile,
  # and api/worker only export when OTEL_EXPORTER_OTLP_ENDPOINT is set:
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 docker compose --profile tracing up --build
  # then open http://localhost:16686. In-memory storage: traces are gone
  # when the container stops.
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    profiles: ["tracing"]
    ports:
      - "127.0.0.1:16686:16686"  # UI
      - "127.0.0.1:4318:4318"    # OTLP/HTTP, for exporting from the host (local dev)
    restart: unless-stopped

volumes:
  db_data:
  uploads:
  models:
