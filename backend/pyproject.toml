[project]
name = "doc-pilot-backend"
version = "0.1.0"
description = "doc-pilot backend — FastAPI service for document intelligence extraction"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142",  # app/main.py passes FastAPI(telemetry=...)
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "alembic",
    "asyncpg",
    "anthropic",
    "pydantic-settings",
    "python-multipart",
    "pypdf",
    "pgvector",
    "fastembed",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-sqlalchemy",
    # Only used when LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY are set
    # (app/langfuse_link.py).
    "langfuse>=4.16,<5",
    # The MCP server (app/mcp_server/). 2.x renamed FastMCP and marks parts of the
    # server API provisional within 2.x, so minor releases are not taken blindly.
    "mcp>=2.3.0,<2.4",
    "jsonschema>=4.20",  # MCP tool arguments are validated in code (app/mcp_server/server.py)
    "argon2-cffi>=25.1,<26",  # password hashes (app/auth/passwords.py)
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "pillow",
    "hypothesis",  # property tests (tests/test_reconcile_properties.py)
    "tzdata",  # Windows has no system tz database for ZoneInfo (tests/test_budget.py)
]
# Recording the feature GIFs (scripts/demos/harness.py); never installed in the
# image or in CI. After installing: python -m playwright install chromium
demo = [
    "playwright>=1.63,<2",  # page.screencast (a synced video clock)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
# B008 (no function calls in argument defaults) contradicts FastAPI's own
# dependency-injection idiom -- Depends()/File()/Query() in route
# signatures is the framework's documented pattern, not a defect.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# app.db builds one module-level asyncpg engine/pool at import time. Keep
# a single event loop for the whole test session so pooled connections
# (bound to the loop they were created on) stay valid across tests instead
# of being torn down between them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["live: hits the real Anthropic API; opt-in via RUN_LIVE_SMOKE=1"]
