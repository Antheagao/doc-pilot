[project]
name = "doc-pilot-backend"
version = "0.1.0"
description = "doc-pilot backend — FastAPI service for document intelligence extraction"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "alembic",
    "asyncpg",
    "anthropic",
    "pydantic-settings",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# app.db builds one module-level asyncpg engine/pool at import time. Keep
# a single event loop for the whole test session so pooled connections
# (bound to the loop they were created on) stay valid across tests instead
# of being torn down between them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
