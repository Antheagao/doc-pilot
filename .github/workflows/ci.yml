name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # pgvector for the retrieval tables (see docker-compose.yml).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docpilot
          POSTGRES_PASSWORD: docpilot
          POSTGRES_DB: docpilot
        # The backend's default database_url expects host port 5434 (see
        # backend/app/config.py and docker-compose.yml).
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U docpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check app tests scripts
      - name: Migrate
        run: alembic upgrade head
      - name: Test
        run: pytest -q

  retrieval-eval:
    # The real-model regression gate: re-run the retrieval eval with the
    # pinned bge-small model (app/retrieval/model_fetch.py) and fail if any
    # metric the newest committed artifact measured fell by more than
    # 0.005 plus one query's worth per query group -- the slack absorbs
    # ONNX float differences between CPUs, which can swap near-tied chunks.
    # (The test suite checks the offline eval against its snapshot exactly.)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docpilot
          POSTGRES_PASSWORD: docpilot
          POSTGRES_DB: docpilot
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U docpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Migrate
        run: alembic upgrade head
      - name: Cache the pinned embedding model
        uses: actions/cache@v4
        with:
          path: .models
          key: embedding-model-${{ hashFiles('backend/app/retrieval/model_fetch.py') }}
      - name: Fetch the pinned embedding model
        run: python scripts/fetch_embedding_model.py
      - name: Retrieval eval against the committed artifact
        run: >-
          python ../evals/run_retrieval.py --embedder fastembed
          --chunk-sizes 0,200 --headers both --check --slack-queries 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npx eslint src
      - name: Build
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose config -q

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - name: Format
        run: terraform fmt -check -recursive -diff
      # Providers come from the registry and must match the committed lock
      # file's hashes; no backend, no credentials.
      - name: Init
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
      # Mocked providers (tests/*.tftest.hcl): checks the deployment's
      # logic without a GCP project.
      - name: Test
        run: terraform test
